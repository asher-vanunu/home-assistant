button_card_templates:
  apple_tile:
    show_state: true
    show_icon: true
    aspect_ratio: 1/1
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    styles:
      card:
        - border-radius: 20px
        - padding: 12px
        - transition: all 0.25s ease
        - background-color: rgba(255, 255, 255, 0.08)
      grid:
        - grid-template-areas: '"i circle" "n n" "s s"'
        - grid-template-columns: 1fr 1fr
        - grid-template-rows: 1fr min-content min-content
      icon:
        - width: 32px
        - justify-self: start
        - color: var(--secondary-text-color)
      name:
        - justify-self: start
        - font-weight: 600
        - font-size: 13px
        - color: var(--primary-text-color)
        - margin-top: 6px
      state:
        - justify-self: start
        - font-size: 11px
        - color: var(--secondary-text-color)
        - text-transform: capitalize
      custom_fields:
        circle:
          - justify-self: end
          - font-size: 11px
          - color: var(--secondary-text-color)
          - border: 1px solid rgba(255, 255, 255, 0.2)
          - border-radius: 50%
          - width: 26px
          - height: 26px
          - line-height: 24px
          - text-align: center
    state:
      - value: 'on'
        styles:
          card:
            - background-color: '#e4e6eb'
          icon:
            - color: '#f39c12'
          name:
            - color: '#1a1a1a'
          state:
            - color: '#555555'
          custom_fields:
            circle:
              - color: '#555555'
              - border: 1px solid rgba(0, 0, 0, 0.2)
    custom_fields:
      circle: |
        [[[
          if (entity && entity.state === 'on' && entity.attributes && entity.attributes.brightness) {
            return Math.round((entity.attributes.brightness / 255) * 100) + '%';
          }
          return '';
        ]]]

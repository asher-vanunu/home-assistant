type: vertical-stack
cards:
  - type: thermostat
    entity: climate.khymvm_svlry
    name: ☀️ חימום בריכה סולארי
    features:
      - type: climate-hvac-modes
        hvac_modes:
          - 'off'
          - heat
          - auto
  - type: entities
    title: נתוני חיישנים
    show_header_toggle: false
    entities:
      - entity: sensor.collector_temperature
        name: טמפרטורת קולט
        icon: mdi:solar-power
      - entity: sensor.storage_temperature
        name: טמפרטורת בריכה
        icon: mdi:pool
      - entity: sensor.flow_temperature
        name: טמפרטורת זרימה
        icon: mdi:pipe-valve
  - type: entities
    title: 'הגדרות מתקדמות:'
    show_header_toggle: false
    entities:
      - entity: number.solar_tdel
        name: tDEL
      - entity: number.solar_ton
        name: tON
      - entity: number.solar_toff
        name: tOFF
      - entity: number.solar_dt_o
        name: DT_O (Switch ON temp diff)
      - entity: number.solar_dt_f
        name: DT_F (Switch OFF temp diff)
      - type: button
        name: שמור הגדרות
        icon: mdi:content-save-cog
        action_name: שמור
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.pool_heater_save_config
      - type: button
        name: איפוס להגדרות יצרן
        icon: mdi:restore
        action_name: אפס
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.pool_heater_reset_defaults
          confirmation:
            text: האם למחוק את הזיכרון ולאפס את כל ההגדרות לברירת מחדל?
type: vertical-stack
cards:
  # כרטיס תרמוסטט - חוגה משנה צבע לכתום כאשר המשאבה דולקת ומחממת
  - type: thermostat
    entity: climate.khymvm_svlry
    name: ☀️ חימום בריכה סולארי
    features:
      - type: climate-hvac-modes
        hvac_modes:
          - 'off'
          - heat
          - auto

  # נתוני חיישנים ובקרה
  - type: entities
    title: נתוני חיישנים ובקרה
    show_header_toggle: false
    entities:
      - entity: binary_sensor.solar_heating_pump_state
        name: סטטוס משאבת חימום
      - entity: sensor.collector_temperature
        name: טמפרטורת קולט
        icon: mdi:solar-power
      - entity: sensor.storage_temperature
        name: טמפרטורת בריכה
        icon: mdi:pool
      - entity: sensor.flow_temperature
        name: טמפרטורת זרימה
        icon: mdi:pipe-valve

  # הגדרות מתקדמות כולל כפתור גלגל שיניים ליומן הפעילות
  - type: entities
    title: הגדרות מתקדמות
    show_header_toggle: false
    entities:
      - entity: number.solar_tdel
        name: tDEL
      - entity: number.solar_ton
        name: tON
      - entity: number.solar_toff
        name: tOFF
      - entity: number.solar_dt_o
        name: DT_O (Switch ON temp diff)
      - entity: number.solar_dt_f
        name: DT_F (Switch OFF temp diff)
      # כפתור גלגל שיניים שפותח חלון קופץ (Popup) עם היסטוריית פעילות המשאבה
      - type: button
        name: יומן פעילות משאבה (Activity)
        icon: mdi:cog-outline
        action_name: הצג
        tap_action:
          action: more-info
          entity: binary_sensor.solar_heating_pump_state
      - type: button
        name: שמור הגדרות
        icon: mdi:content-save-cog
        action_name: שמור
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.pool_heater_save_config
      - type: button
        name: איפוס להגדרות יצרן
        icon: mdi:restore
        action_name: אפס
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.pool_heater_reset_defaults
          confirmation:
            text: האם למחוק את הזיכרון ולאפס את כל ההגדרות לברירת מחדל?